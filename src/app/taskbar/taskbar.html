<div class="taskbar">

  <div class="dock">

<button 
class="dock-icon"
(click)="openApp('Files')">
📁
</button>


<button class="dock-icon">
🌐
</button>


<button class="dock-icon">

</button>

</button>


<button class="dock-icon">
