<div class="nexus">

  <!-- 🔵 3D BACKGROUND CORE -->
  <div class="core-layer">
    <app-ai-core></app-ai-core>
  </div>

  <!-- 🧠 LEFT PANEL -->
  <div class="panel left">
    <h3>SYSTEM STATUS</h3>
    <p>AI: ONLINE</p>
    <p>CPU: STABLE</p>
    <p>SECURITY: HIGH</p>
  </div>

  <!-- 🔥 CENTER UI -->
  <div class="center">
    <div class="scanline"></div>
    <h1>JARVIS CORE ACTIVE</h1>
    <p>Neural Network Synced</p>
  </div>

  <!-- 📊 RIGHT PANEL -->
  <div class="panel right">
    <h3>MODULES</h3>
    <p>Web Engine</p>
    <p>App Engine</p>
    <p>AI Engine</p>
    <p>Cloud Sync</p>
  </div>

  <!-- 📡 LOGS -->
  <div class="logs">
    <div *ngFor="let item of log">
      {{ item }}
    </div>
  </div>

</div>
