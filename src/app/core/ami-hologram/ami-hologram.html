<div 
class="holo-system"

[class.online]="online"

[class.listening]="jarvisStatus==='LISTENING'"

[class.speaking]="jarvisStatus==='SPEAKING'"

[class.processing]="jarvisStatus==='PROCESSING'"

[class.executing]="jarvisStatus==='EXECUTING'">
  <!-- AI Core -->
 <!-- AI Core Label -->
<div class="ami-center">


<!-- JARVIS ENERGY RINGS -->

<div class="core-ring ring-1"></div>

<div class="core-ring ring-2"></div>

<div class="core-ring ring-3"></div>


<!-- SCANNER -->

<div class="scanner-line"></div>



<h2>
JARVIS CORE
</h2>


<p>
{{jarvisStatus}}
</p>


</div>

  <!-- Connection Lines -->
<div class="line line-1"></div>
<div class="line line-2"></div>
<div class="line line-3"></div>
<div class="line line-4"></div>
<div class="line line-5"></div>
<div class="line line-6"></div>
<div class="line line-7"></div>
<div class="line line-8"></div>

  <!-- Modules -->
  <div class="module-card card-1" (click)="launch('Web Engine')">🌐<span>WEB ENGINE</span></div>
  <div class="module-card card-2" (click)="launch('App Engine')">📦<span>APP ENGINE</span></div>
  <div class="module-card card-3" (click)="launch('AI Engine')">🧠<span>AI ENGINE</span></div>
  <div class="module-card card-4" (click)="launch('Cloud Sync')">☁️<span>CLOUD SYNC</span></div>
  <div class="module-card card-5" (click)="launch('Voice AI')">🎤<span>VOICE AI</span></div>
  <div class="module-card card-6" (click)="launch('Camera Vision')">👁️<span>CAMERA VISION</span></div>
  <div class="module-card card-7" (click)="launch('Neural Network')">🧬<span>NEURAL NETWORK</span></div>
  <div class="module-card card-8" (click)="launch('Data Core')">💾<span>DATA CORE</span></div>

  <!-- Floor effect -->
  <div class="holo-floor"></div>
</div>
